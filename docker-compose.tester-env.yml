services:
  app:
    image: ${IMAGE_TAG:-tester-env-modx-revolution:dev}
    build:
      context: .
      dockerfile: Dockerfile.tester-env
    ports:
      - "${PORT:-8096}:80"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: modx
      MYSQL_USER: modx
      MYSQL_PASSWORD: modx
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -proot -e 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - modx-mysql:/var/lib/mysql

volumes:
  modx-mysql:
    name: modx-mysql${RUN_SUFFIX:-}
